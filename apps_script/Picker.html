<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
  <style>
    body {
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    #upload-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    #status {
      margin-top: 15px;
      font-style: italic;
      color: #333;
    }
    .button {
      background-color: #4285f4;
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
    }
    .button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h2>Cargador de CFDI XML</h2>
  <p>Selecciona los archivos XML desde tu computadora para procesarlos.</p>

  <form id="upload-form">
    <input type="file" id="xml-files" accept=".xml,text/xml" multiple>
    <button type="submit" class="button" id="submit-button">Cargar y Procesar</button>
  </form>

  <div id="status"></div>

  <script>
    const form = document.getElementById('upload-form');
    const fileInput = document.getElementById('xml-files');
    const submitButton = document.getElementById('submit-button');
    const statusDiv = document.getElementById('status');

    form.addEventListener('submit', event => {
      event.preventDefault();

      if (fileInput.files.length === 0) {
        statusDiv.textContent = 'Por favor, selecciona al menos un archivo.';
        return;
      }

      submitButton.disabled = true;
      statusDiv.innerHTML = `Leyendo ${fileInput.files.length} archivo(s)...`;

      const promises = Array.from(fileInput.files).map(file => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = e => resolve(e.target.result);
          reader.onerror = e => reject(new Error('Error al leer el archivo: ' + file.name));
          reader.readAsText(file);
        });
      });

      Promise.all(promises)
        .then(fileContents => {
          statusDiv.innerHTML = 'Procesando en el servidor...';
          google.script.run
            .withSuccessHandler(response => {
              statusDiv.innerHTML = response;
              submitButton.disabled = false;
               setTimeout(() => google.script.host.close(), 4000);
            })
            .withFailureHandler(err => {
              statusDiv.textContent = 'Error: ' + err.message;
              submitButton.disabled = false;
            })
            .processLocalXmlFiles(fileContents);
        })
        .catch(error => {
          statusDiv.textContent = error.message;
          submitButton.disabled = false;
        });
    });
  </script>
</body>
</html>
